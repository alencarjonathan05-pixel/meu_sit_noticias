
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Notícias</title>
</head>

<body>

    <img src="logo.jpg" alt="Logo" width="80">

    <h1>News</h1>

    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="listagem.html">Listagem</a></li>
            <li><a href="cadastro.html">Cadastro</a></li>
        </ul>
    </nav>

    <h2>Cadastro de Notícias</h2>

    <form action="#" method="post" enctype="multipart/form-data">

        <label for="categoria">Categoria:</label>
        <select id="categoria" name="categoria" required>
            <option value="">Selecione uma categoria</option>
            <option value="Front-end">Front-end</option>
            <option value="Back-end">Back-end</option>
        </select>

        <br><br>

        <label for="titulo">Título:</label>
        <input type="text" id="titulo" name="titulo"
               placeholder="Digite o título da notícia" required>

        <br><br>

        <label for="data">Data:</label>
        <input type="date" id="data" name="data" required>

        <br><br>

        <label for="texto">Texto da notícia:</label>
        <br>
        <textarea id="texto" name="texto" rows="8" cols="50"
                  placeholder="Digite o texto da notícia"
                  required></textarea>

        <br><br>

        <label for="foto">Foto:</label>
        <input type="file" id="foto" name="foto"
               accept="image/*" required>

        <br><br>

        <button type="submit">Cadastrar notícia</button>
        <button type="reset">Limpar formulário</button>

    </form>

    <p>
        <a href="listagem.html">Voltar para a listagem</a>
    </p>

    <footer>
        <p>Desenvolvido por Jonathan Alencar</p>
    </footer>

</body>
</html>
